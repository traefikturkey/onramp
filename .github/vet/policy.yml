name: OnRamp dependency security policy
description: Reject vulnerable or malicious dependencies.
tags:
  - security
  - supply-chain
filters:
  - name: critical-or-high-vulnerabilities
    check_type: CheckTypeVulnerability
    summary: Critical or high severity vulnerabilities were found
    value: |
      vulns.critical.exists(v, true) || vulns.high.exists(v, true)
  - name: known-malware
    check_type: CheckTypeMalware
    summary: A dependency is identified as malware
    value: |
      vulns.all.exists(v, v.id.startsWith("MAL-"))
  - name: dangerous-release-workflow
    check_type: CheckTypeSecurityScorecard
    summary: A dependency has a dangerous release workflow
    value: |
      scorecard.scores["Dangerous-Workflow"] == 0
