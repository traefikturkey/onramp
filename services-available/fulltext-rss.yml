networks:
  traefik:
    external: true

# description: DEPRECATED - Full-text RSS uses unpatched PHP 5.6. Do not use for new deployments or expose to untrusted clients.
# https://github.com/heussd/fivefilters-full-text-rss-docker
# PHP 5.6.40 is affected by CVE-2026-109618 and CVE-2026-109619.
# Pulling latest does not fix this: upstream intentionally retains PHP 5.
# Retained for existing installations; no replacement image has been selected.
# See docs/troubleshooting.md#php-container-security-updates

services:
  fulltext-rss:
    image: heussd/fivefilters-full-text-rss:${FULLTEXT_RSS_DOCKER_TAG:-latest}
    env_file:
      - ./services-enabled/fulltext-rss.env
    container_name: ${FULLTEXT_RSS_CONTAINER_NAME:-fulltext-rss}
    restart: ${FULLTEXT_RSS_RESTART:-unless-stopped}
    networks:
      - traefik
    volumes:
      - ./etc/fulltext-rss:/config # <==== this probably needs changed
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    labels:
      - joyride.host.name=${FULLTEXT_RSS_CONTAINER_NAME:-fulltext-rss}.${HOST_DOMAIN}
      - traefik.enable=true
      - traefik.http.routers.fulltext-rss.entrypoints=websecure
      - traefik.http.routers.fulltext-rss.rule=Host(`${FULLTEXT_RSS_CONTAINER_NAME:-fulltext-rss}.${HOST_DOMAIN}`)
      - traefik.http.services.fulltext-rss.loadbalancer.server.port=8096
      - com.centurylinklabs.watchtower.enable=${FULLTEXT_RSS_WATCHTOWER_ENABLED:-true}
      - autoheal=true
