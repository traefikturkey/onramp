networks:
  traefik:
    external: true

# config_version: 2
# description: Self-hosted metasearch engine
# https://github.com/searxng/searxng-docker
# Copy the settings template in etc/searxng and save it as settings.yml in the same directory.
# Make sure you change the secret key.

services:
  searxng:
    image: ghcr.io/searxng/searxng:${SEARXNG_DOCKER_TAG:-latest}
    env_file:
      - ./services-enabled/searxng.env
    container_name: ${SEARXNG_CONTAINER_NAME:-searxng}
    restart: ${SEARXNG_RESTART:-unless-stopped}
    networks:
      traefik:
        aliases:
          - searxng
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - UMASK=022
      - SEARXNG_BASE_URL=https://${SEARXNG_HOST_NAME:-searxng}.${HOST_DOMAIN}/
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ${SEARXNG_VOLUME-./etc/searxng}:/etc/searxng:rw
      - /etc/localtime:/etc/localtime:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      - joyride.host.name=${SEARXNG_HOST_NAME:-searxng}.${HOST_DOMAIN}
      - traefik.enable=${SEARXNG_TRAEFIK_ENABLE:-true}
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOST_NAME:-searxng}.${HOST_DOMAIN}`)
      - traefik.http.services.searxng.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.enable=${SEARXNG_WATCHTOWER_ENABLED:-true}
      - autoheal=${SEARXNG_AUTOHEAL:-false}


  redis:
    container_name: searxng-redis
    image: "redis:alpine"
    env_file:
      - ./services-enabled/searxng.env
    command: redis-server --save "" --appendonly "no"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /var/lib/redis
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: ${SEARXNG_REDIS_RESTART:-unless-stopped}
    networks:
      - traefik
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.enable=${SEARXNG_REDIS_WATCHTOWER_ENABLE:-true}
      - autoheal=${SEARXNG_REDIS_AUTOHEAL:-false}
