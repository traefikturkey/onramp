networks:
  traefik:
    external: true

# config_version: 2
# description: Self-hosted metasearch engine
# https://docs.searxng.org/admin/installation-docker.html
# Scaffold creates etc/searxng/settings.yml; change its secret_key before starting.

services:
  searxng:
    image: ghcr.io/searxng/searxng:${SEARXNG_DOCKER_TAG:-latest}
    env_file:
      - ./services-enabled/searxng.env
    container_name: ${SEARXNG_CONTAINER_NAME:-searxng}
    restart: ${SEARXNG_RESTART:-unless-stopped}
    depends_on:
      - searxng-valkey
    networks:
      traefik:
        aliases:
          - searxng
    environment:
      - TZ=${TZ}
      - SEARXNG_BASE_URL=https://${SEARXNG_HOST_NAME:-searxng}.${HOST_DOMAIN}/
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ${SEARXNG_VOLUME:-./etc/searxng}:/etc/searxng:rw
      - ${SEARXNG_CACHE_VOLUME:-./media/searxng/cache}:/var/cache/searxng:rw
      - /etc/localtime:/etc/localtime:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      - joyride.host.name=${SEARXNG_HOST_NAME:-searxng}.${HOST_DOMAIN}
      - traefik.enable=${SEARXNG_TRAEFIK_ENABLE:-true}
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOST_NAME:-searxng}.${HOST_DOMAIN}`)
      - traefik.http.services.searxng.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.enable=${SEARXNG_WATCHTOWER_ENABLED:-true}
      - autoheal=${SEARXNG_AUTOHEAL:-false}


  searxng-valkey:
    container_name: searxng-valkey
    image: valkey/valkey:${SEARXNG_VALKEY_DOCKER_TAG:-9-alpine}
    env_file:
      - ./services-enabled/searxng.env
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    environment:
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./media/searxng/valkey:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: ${SEARXNG_VALKEY_RESTART:-unless-stopped}
    networks:
      - traefik
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.enable=${SEARXNG_VALKEY_WATCHTOWER_ENABLE:-true}
      - autoheal=${SEARXNG_VALKEY_AUTOHEAL:-false}
