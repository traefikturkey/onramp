networks:
  traefik:
    external: true

# description: Web-based MySQL and MariaDB database management tool
# https://hub.docker.com/_/phpmyadmin
# https://github.com/phpmyadmin/docker

services:
  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_DOCKER_TAG:-latest}
    env_file:
      - ./services-enabled/phpmyadmin.env
    container_name: phpmyadmin
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - ./etc/phpmyadmin/sessions:/sessions
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=1G
    labels:
      - joyride.host.name=phpmyadmin.${HOST_DOMAIN}
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.${HOST_DOMAIN}`)
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80
      - com.centurylinklabs.watchtower.enable=${PHPMYADMIN_WATCHTOWER_ENABLED:-true}
      - autoheal=true
