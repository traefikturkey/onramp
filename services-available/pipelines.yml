networks:
  traefik:
    external: true

# config_version: 2
# description: Open WebUI Pipelines OpenAI-compatible function and filter backend
# https://github.com/open-webui/pipelines
# https://github.com/open-webui/open-webui
# category: ai

services:
  pipelines:
    image: ghcr.io/open-webui/pipelines:${PIPELINES_DOCKER_TAG:-main}
    env_file:
      - ./services-enabled/pipelines.env
    container_name: ${PIPELINES_CONTAINER_NAME:-pipelines}
    restart: ${PIPELINES_RESTART:-unless-stopped}
    networks:
      - traefik
    volumes:
      - ${PIPELINES_DATA_PATH:-./etc/pipelines}:/app/pipelines
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - PIPELINES_API_KEY=${PIPELINES_API_KEY}
    labels:
      - joyride.host.name=${PIPELINES_HOST_NAME:-pipelines}.${HOST_DOMAIN}
      - traefik.enable=${PIPELINES_TRAEFIK_ENABLE:-false}
      - traefik.http.routers.pipelines.entrypoints=websecure
      - traefik.http.routers.pipelines.rule=Host(`${PIPELINES_HOST_NAME:-pipelines}.${HOST_DOMAIN}`)
      - traefik.http.services.pipelines.loadbalancer.server.port=9099
      - com.centurylinklabs.watchtower.enable=${PIPELINES_WATCHTOWER_ENABLE:-true}
      - autoheal=${PIPELINES_AUTOHEAL:-false}
